; Cloud shadows were the dominant GPU pass in the Mountain demo.
; Low/Medium/High keep visible clouds and clean Lumen GI while omitting expensive cloud ground shadow maps.

[ShadowQuality@0]
r.VolumetricCloud.ShadowMap=0
r.VolumetricCloud.ShadowMap.MaxResolution=512
r.VolumetricCloud.ShadowMap.RaySampleMaxCount=32

[ShadowQuality@1]
r.VolumetricCloud.ShadowMap=0
r.VolumetricCloud.ShadowMap.MaxResolution=512
r.VolumetricCloud.ShadowMap.RaySampleMaxCount=32

[ShadowQuality@2]
r.VolumetricCloud.ShadowMap=0
r.VolumetricCloud.ShadowMap.MaxResolution=1024
r.VolumetricCloud.ShadowMap.RaySampleMaxCount=64

[ShadowQuality@3]
r.VolumetricCloud.ShadowMap=1
r.VolumetricCloud.ShadowMap.MaxResolution=1024
r.VolumetricCloud.ShadowMap.RaySampleMaxCount=64

[ShadowQuality@Cine]
r.VolumetricCloud.ShadowMap=1
r.VolumetricCloud.ShadowMap.MaxResolution=2048
r.VolumetricCloud.ShadowMap.RaySampleMaxCount=128

[GlobalIlluminationQuality@0]
r.DistanceFieldAO=0
r.SkylightIntensityMultiplier=1.0
r.AOQuality=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.ScreenProbeGather.DownsampleFactor=32

[GlobalIlluminationQuality@1]
r.DistanceFieldAO=0
r.SkylightIntensityMultiplier=1.0
r.AOQuality=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.ScreenProbeGather.DownsampleFactor=32

[GlobalIlluminationQuality@2]
r.DistanceFieldAO=0
r.SkylightIntensityMultiplier=1.0
r.AOQuality=1
r.Lumen.DiffuseIndirect.Allow=1
r.Lumen.ScreenProbeGather.DownsampleFactor=32

[ReflectionQuality@1]
r.SSR.Quality=2
r.SSR.HalfResSceneColor=1
r.Lumen.Reflections.Allow=1
r.Lumen.Reflections.DownsampleFactor=2
