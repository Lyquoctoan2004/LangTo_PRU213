; Lobby "Xác nhận nói chuyện" talk area (Source/MutableSample/CharacterTalkChat.h).
; Provider=Anthropic uses the Claude Messages API; Provider=OpenAI uses any OpenAI-compatible /chat/completions
; endpoint, e.g. Endpoint=http://localhost:11434/v1/chat/completions with Model=qwen2.5 for a local Ollama.
; Keep URLs in double quotes: Unreal treats an unquoted "//" as the start of a comment and cuts the URL to "https:".
; Leave ApiKey empty to read ANTHROPIC_API_KEY / OPENAI_API_KEY from the environment (keeps the key out of the repo).
[/Script/MutableSample.CharacterTalkSettings]
; Gemini through its OpenAI-compatible endpoint; the key is read from the GEMINI_API_KEY environment variable.
; For Claude instead: Provider=Anthropic, Endpoint=https://api.anthropic.com/v1/messages, Model=claude-opus-5-5,
; and an empty ApiKeyEnvironmentVariable (reads ANTHROPIC_API_KEY).
Provider=OpenAI
Endpoint="https://generativelanguage.googleapis.com/v1beta/openai/chat/completions"
; One model. A comma-separated list ("a,b") would hand over to the next model when one hits its quota.
Model=gemini-3.5-flash
ApiKey=
ApiKeyEnvironmentVariable=GEMINI_API_KEY
; Thinking level for chat and listening: low keeps replies quick (45 s -> 5 s on gemini-3.5-flash). Leave empty if a model rejects it.
Effort=low
; Speak a reply sentence by sentence while it is still being written, instead of waiting for all of it.
bStreamReplies=True
bServerSideFallback=True
; Voice: speak with the "Nói" button; replies are read aloud with lip sync.
; VoiceProvider=Gemini needs nothing installed (uses GEMINI_API_KEY). VoiceProvider=Server uses two free local servers:
;   whisper.cpp:  whisper-server.exe -m ggml-small.bin -l vi --port 8080
;   Speech:       Scripts/StartVoiceServer.bat (Edge male voice NamMinh, Piper vivos when offline; installed in %LOCALAPPDATA%/LangToLuaVoice)
VoiceProvider=Gemini
GeminiSpeechToTextModel=gemini-3.5-flash
; Speech models tried in order, all reading with GeminiVoice: when one is out of quota (429) the next takes over.
GeminiTextToSpeechModel=gemini-3.8-flash-tts,gemini-3.1-flash-tts-preview,gemini-3.8-flash-lite-tts
; Male: Charon (calm), Orus (firm), Puck (upbeat), Fenrir (lively). Female: Kore, Aoede, Leda, Zephyr.
; Fallback voice; each personality below picks its own.
GeminiVoice=Charon
; False: every personality speaks with GeminiVoice (one voice). True: each personality has its own Gemini voice.
bVoicePerPersonality=False
; Scenario (who the character is) when the talk area first opens: Làng Lụa, Giảng viên IT, Bạn thân, Phỏng vấn xin việc, Gia sư tiếng Anh, Người lắng nghe, Hướng dẫn viên.
DefaultScenario=Làng Lụa
; Personality when the talk area first opens: Hiền lành, Hài hước, Nghiêm nghị, Nóng tính, Tinh nghịch, Thông thái, Nhút nhát.
DefaultPersonality=Hiền lành
SpeechToTextEndpoint="http://127.0.0.1:8080/inference"
SpeechToTextLanguage=vi
TextToSpeechEndpoint="http://127.0.0.1:5000/synthesize"
; With VoiceProvider=Gemini: True reads a line with the local speech server when Gemini cannot (a second voice). Off: Gemini only.
bFallbackToServerSpeech=False
; True: replies are read by Gemini (GeminiVoice). False: by the local speech server (Scripts/StartVoiceServer.bat) only.
bGeminiSpeaks=True
; Piper voice and speaker: vivos speaker 29 is a mid-pitched man. Other men in vivos: 57 (deep), 56, 45, 55, 54, 43, 50, 8.
; vi_VN-vais1000-medium (PiperSpeakerId=-1) is clearer but a woman.
PiperVoice=vi_VN-vivos-x_low
PiperSpeakerId=29
; Sentences fetched from the speech server at once; the online Edge voice can take longer per sentence than saying it.
MaxParallelSpeechRequests=3
bSpeakReplies=True
; Hold to talk, release to send. Use a key that types nothing (Tab, LeftAlt, F1...), or the chat box loses it.
PushToTalkKey=Tab
JawBone=FACIAL_C_Jaw
JawOpenDegrees=14
; Face while talking: blinks, glances, head motion and emotions (the reply starts with a tag like [vui] that is not shown or spoken).
; EmotionStrength 0..1 scales every expression; the rest are distances in cm / angles in degrees at full expression.
bLivelyFace=True
EmotionStrength=1.0
BrowMoveCm=0.5
SmileCm=0.4
BlinkDegrees=25
HeadMotionDegrees=2.5
EyeMotionDegrees=4
